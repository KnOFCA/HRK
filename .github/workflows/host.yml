name: HRK host validation
on: [push, pull_request]
jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # SDD evidence checks resolve stable validation tags and source history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cmake -S . -B build/ci -G Ninja -DHRK_SANITIZE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build/ci
      - name: Test with sanitizers
        shell: bash
        run: |
          set +e
          ctest --test-dir build/ci --output-on-failure > build/ci/ctest-output.txt 2>&1
          result=$?
          cat build/ci/ctest-output.txt
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          output = Path("build/ci/ctest-output.txt").read_text()
          output = output[:20000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print("::error title=CTest failure::" + output)
          PY
          fi
          exit "$result"
      - run: bash tools/sdd/check.sh
